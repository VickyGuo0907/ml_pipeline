# Stage 07 — model training config for hospital_readmission_lagged pipeline
#
# Validation plan requires 1 unsupervised (see pipeline.yaml's unsupervised block) + 2+
# supervised models: an elastic-net baseline and LightGBM, per the capstone proposal, plus
# a random forest for the linear-vs-nonlinear contrast already established in
# biomedical_clinical.
#
# Evaluation thresholds, calibrated against the first honest real run (2026-07-24, after
# fixing the target-imputation bug — 2,731 real hospitals, not the earlier contaminated
# 3,085): elastic_net test_r2=0.234, random_forest=0.178, lightgbm=0.190; test_rmse in
# 0.0585-0.0605. min_test_r2 mirrors biomedical_clinical's "reject worse than predicting
# the mean" floor — a low-but-honest R² is an acceptable result per the proposal, but a
# negative one indicates something broke. max_test_rmse is set at roughly 2x the worst
# currently-registered model, matching biomedical_clinical's tuning philosophy: enough
# headroom for normal run-to-run variation, tight enough to catch a real regression.
#
# Model `name` values are prefixed with the pipeline_type to keep MLflow's shared
# registry namespace collision-free — every pipeline previously registered a model
# named e.g. "lightgbm_gbm", so different pipelines' models were landing as versions
# of the SAME registered model. serve.py's SERVING_MODEL_NAME must be one of these
# full prefixed names.
random_state: 42
train_test_split: 0.80

evaluation:
  min_test_r2: 0.0
  max_test_rmse: 0.12
  # Champion is chosen on cross-validated R² rather than a single hold-out RMSE.
  # Under State-grouped CV all three models land within 0.003 R² of each other
  # (elastic_net 0.0505, random_forest 0.0529, lightgbm 0.0506), so the mean alone
  # cannot separate them — but their fold-to-fold spreads differ by 3x
  # (0.027 / 0.055 / 0.080). Ties within cv_tie_tolerance are therefore broken on
  # stability, which favours the model that behaves consistently across regions.
  # Default remains "test_rmse", so biomedical_clinical and bioinfo_gene are unaffected.
  champion_metric: "cv_r2"
  cv_tie_tolerance: 0.005

# 5-fold CV on the training set, grouped by State. Hospitals in the same state share
# patient populations, referral patterns and policy environments, so a plain random
# split can put near-neighbours of a test hospital into training and overstate
# performance. Measured on the 2026-08-05 matrix: the elastic net scores 0.072 +/- 0.008
# under a shuffled KFold but 0.051 +/- 0.027 when grouped by State, so roughly a third
# of the apparent performance came from that leakage across folds.
# Defaults are enabled: false, so biomedical_clinical and bioinfo_gene are unaffected.
cross_validation:
  enabled: true
  folds: 5
  group_column: "State"

# Residual assumption tests. Only linear families are diagnosed — tree ensembles make
# no distributional assumptions about their errors, so Durbin-Watson or Breusch-Pagan
# would not be interpretable for the random forest or LightGBM.
diagnostics:
  enabled: true
  linear_types: ["ols", "ridge", "lasso", "elastic_net"]

# Ranked feature importance per model, read from coef_ (linear) or
# feature_importances_ (trees). No SHAP dependency: for the elastic-net champion the
# coefficients already are the explanation, and sklearn's built-in importances answer
# the same question for the tree models at no cost. Full ranking is an MLflow
# artifact; the top 10 lands in the evaluation report.
feature_importance:
  enabled: true
  top_n: 10

models:
  - name: "hospital_readmission_lagged_elastic_net"
    type: "elastic_net"
    hyperparameters:
      alpha: 0.01
      l1_ratio: 0.5
      max_iter: 2000

  - name: "hospital_readmission_lagged_random_forest"
    type: "random_forest"
    hyperparameters:
      n_estimators: 100
      max_features: "sqrt"   # feature count isn't fixed ahead of time like biomedical_clinical's 10
      random_state: 42
      n_jobs: -1

  - name: "hospital_readmission_lagged_lightgbm_gbm"
    type: "gbm"
    hyperparameters:
      n_estimators: 100
      learning_rate: 0.05
      max_depth: 7
      num_leaves: 31
      min_child_samples: 20
      subsample: 0.8
      colsample_bytree: 0.8
      reg_alpha: 0.0
      reg_lambda: 1.0
      random_state: 42
      n_jobs: -1
