# Hospital Readmission Lagged Pipeline — cleaning config
#
# Every source file here carries the same CMS hospital-directory metadata (Facility Name,
# Address, City/Town, ZIP Code, County/Parish, Telephone Number, Footnote, Start/End Date).
# None of it is a usable predictor, and leaving it in would collide with the spine's own
# copies when Hospital_General_Information is direct-joined in Stage 5.
impute_strategy: "median"

drop_column_patterns:
  - "Footnote"
  - "Start Date"
  - "End Date"
  - "Facility Name"
  - "Address"
  - "City/Town"
  - "ZIP Code"
  - "County/Parish"
  - "Telephone Number"

# HCAHPS Linear Mean Value and Score are shared value columns that mix many unrelated
# measure types before the Stage 5 pivot filters/splits them apart. Protecting them here
# means they're neither dropped for high-missing nor globally median-imputed across
# unrelated measures — Stage 5's per-measure pivot, then the per-column median fill in
# src/features.py, impute them correctly instead.
#
# Facility ID: some Hospital_General_Information rows use an alphanumeric Facility ID
# (e.g. "01014F") for certain facility types. Forcing it to numeric here would silently
# collapse those hospitals onto one shared imputed ID before the join ever runs. The
# feature-engineering join step already does its own explicit numeric coercion on this
# column when actually building the join key, which is the right place for that tradeoff.
#
# Excess Readmission Ratio: the target column. At Stage 4 this file hasn't been filtered
# to the PN measure yet, so it mixes all 6 HRRP measures (AMI, CABG, COPD, HF, PN, STK) in
# one column. Median-imputing it here fills genuinely-missing 2025 pneumonia ratios with a
# cross-measure median — fabricating target values for hospitals with no real outcome.
# Protecting it means those NaNs survive to engineer_features' dropna(subset=[target_col]),
# which correctly excludes those hospitals instead of training/testing on a made-up number.
protect_columns:
  - "HCAHPS Linear Mean Value"
  - "Score"
  - "Facility ID"
  - "Excess Readmission Ratio"

# Columns to check for exact duplicates (null = check all columns)
duplicates_subset: null
