# TODO: define models for gene expression prediction
#
# Model `name` values are prefixed with the pipeline_type to keep MLflow's shared
# registry namespace collision-free — every pipeline previously registered a model
# named e.g. "lightgbm_gbm", so different pipelines' models were landing as versions
# of the SAME registered model. serve.py's SERVING_MODEL_NAME must be one of these
# full prefixed names.
random_state: 42
train_test_split: 0.80

evaluation:
  min_test_r2: 0.0    # reject models worse than predicting the mean
  max_test_rmse: null # RMSE scale unknown until first run — disable for now

models:
  - name: bioinfo_gene_ridge_baseline
    type: ridge
    hyperparameters:
      alpha: 1.0

  - name: bioinfo_gene_lightgbm_gbm
    type: gbm
    hyperparameters:
      n_estimators: 100
      learning_rate: 0.05
      max_depth: 6
      random_state: 42
      n_jobs: -1
