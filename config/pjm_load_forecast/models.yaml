# Models trained and compared per run:
#   - seasonal_naive: same hour yesterday and same hour last week.
#     Both use the same daily cutoffs and 24-hour horizons, never registered.
#   - ets: classical univariate baseline.
#   - gbm: LightGBM regression on lag/rolling/calendar/holiday features plus
#     hourly weather (wx_ features) - the main model.
#   - gbm_no_weather: identical GBM without the wx_ features, so each run
#     measures how much weather itself is worth (and stays servable, since
#     live serving has no weather forecast feed yet).
# Hyperparameters are fixed here, not searched (Optuna/Ray Tune are out of
# scope for this project).
#
# SARIMAX was dropped from the default run: fitting it on hourly data with a
# 24h seasonal period took 2-11GB of memory and minutes per fit, and it
# never produced a usable forecast (~100% MAPE). Regression models with
# weather drivers train in seconds and are the better use of compute here.
# The sarimax model type is still supported by the code if needed.

models:
  - name: "pjm_load_forecast_daily_naive"
    type: "seasonal_naive"
    hyperparameters:
      season_length: 24

  - name: "pjm_load_forecast_seasonal_naive"
    type: "seasonal_naive"
    hyperparameters:
      season_length: 168

  - name: "pjm_load_forecast_ets"
    type: "ets"
    hyperparameters:
      seasonal_periods: 24
      trend: "add"
      seasonal: "add"

  - name: "pjm_load_forecast_gbm"
    type: "gbm"
    hyperparameters:
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 7
      num_leaves: 31
      random_state: 42
      n_jobs: -1

  - name: "pjm_load_forecast_gbm_direct"
    type: "gbm_direct"
    hyperparameters:
      training_stride_hours: 6
      n_estimators: 150
      learning_rate: 0.05
      max_depth: 7
      num_leaves: 31
      random_state: 42
      n_jobs: -1

  - name: "pjm_load_forecast_gbm_no_weather"
    type: "gbm"
    hyperparameters:
      use_weather: false
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 7
      num_leaves: 31
      random_state: 42
      n_jobs: -1

evaluation:
  horizon_hours: 24
  n_windows: 50
  champion_metric: "cv_mape"
